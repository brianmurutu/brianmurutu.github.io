<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-grad)" stroke="url(#glow-grad)" stroke-width="8"/>

  <g filter="url(#glow)">
    <path d="M 120 190 L 65 256 L 120 322" fill="none" stroke="url(#brand-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 392 190 L 447 256 L 392 322" fill="none" stroke="url(#brand-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 175 165 L 175 347 M 175 165 L 225 165 C 255 165 272 182 272 208 C 272 230 255 246 225 248 M 175 248 L 235 248 C 268 248 285 266 285 295 C 285 328 262 347 225 347 L 175 347" 
          fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 305 347 L 330 165 L 355 255 L 380 165 L 395 347" 
          fill="none" stroke="url(#brand-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>