<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 74" width="360" height="74">
  <defs>
    <linearGradient id="logo-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4250f5"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="text-white-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Emblem Icon (Size 60x60) -->
  <g transform="translate(6, 7)">
    <!-- Rounded Squircle Badge -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="#0f172a" stroke="url(#logo-badge-grad)" stroke-width="3"/>
    
    <!-- Code Bracket and Monogram -->
    <g filter="url(#logo-glow)">
      <path d="M 14 24 L 7 30 L 14 36" fill="none" stroke="url(#accent-cyan)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 46 24 L 53 30 L 46 36" fill="none" stroke="url(#accent-cyan)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- BM Letters -->
    <text x="18" y="39" font-family="'Open Sans', -apple-system, sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="-0.5">BM</text>
  </g>

  <!-- Typography Brand Text -->
  <g transform="translate(80, 0)">
    <!-- Main Brand Name (Bold & Crisp) -->
    <text x="0" y="40" font-family="'CircularStdBold', 'Open Sans', -apple-system, sans-serif" font-weight="800" font-size="30" fill="url(#text-white-grad)" letter-spacing="0.5">
      Sir. <tspan fill="url(#logo-badge-grad)">Brian</tspan>
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="1" y="59" font-family="'Open Sans', sans-serif" font-weight="700" font-size="10.5" fill="#94a3b8" letter-spacing="2.8" text-transform="uppercase">
      IT ARCHITECT &amp; WEB DEV
    </text>
  </g>
</svg>