<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="100%" height="100%">
  <defs>
    <linearGradient id="stack-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="60%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#0e1730"/>
    </linearGradient>
    <linearGradient id="stack-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(36, 123, 255, 0.5)"/>
      <stop offset="50%" stop-color="rgba(255, 53, 79, 0.25)"/>
      <stop offset="100%" stop-color="rgba(36, 123, 255, 0.1)"/>
    </linearGradient>
    <pattern id="stack-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.04)"/>
    </pattern>
    <radialGradient id="stack-sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#247bff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#070b16" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif; }
    .font-mono { font-family: 'SF Mono', Consolas, Monaco, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="876" height="356" rx="20" fill="url(#stack-bg-grad)" stroke="url(#stack-border-grad)" stroke-width="1.5"/>
  <rect x="2" y="2" width="876" height="356" rx="20" fill="url(#stack-dots)"/>

  <!-- Header Title -->
  <g transform="translate(48, 38)">
    <text class="font-mono" x="0" y="0" fill="#247bff" font-size="12" font-weight="700" letter-spacing="1.5">STACK RADAR &amp; ECOSYSTEM</text>
    <text class="font-sans" x="0" y="26" fill="#ffffff" font-size="22" font-weight="800">Planetary Tech Engine</text>
  </g>

  <!-- Central Tilted Elliptical Orbits Graphic (Center x=680, y=180) -->
  <g transform="translate(680, 180)">
    <!-- Ambient Core Glow -->
    <circle cx="0" cy="0" r="70" fill="url(#stack-sun-glow)"/>
    
    <!-- Central Star Node -->
    <circle cx="0" cy="0" r="18" fill="#0d1527" stroke="#00d2ff" stroke-width="2"/>
    <text class="font-sans" x="0" y="6" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle">TS</text>

    <!-- Orbit 1 (Inner, tilted -20deg) -->
    <g transform="rotate(-20)">
      <ellipse cx="0" cy="0" rx="90" ry="42" fill="none" stroke="rgba(36,123,255,0.4)" stroke-width="1.2" stroke-dasharray="4 6"/>
      <!-- Planet on Orbit 1: React / Next -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
        <g transform="translate(90, 0)">
          <circle cx="0" cy="0" r="12" fill="#0d1527" stroke="#00d2ff" stroke-width="1.5"/>
          <text class="font-sans" x="0" y="4" fill="#00d2ff" font-size="9" font-weight="800" text-anchor="middle">⚛</text>
        </g>
      </g>
    </g>

    <!-- Orbit 2 (Middle, tilted 30deg) -->
    <g transform="rotate(30)">
      <ellipse cx="0" cy="0" rx="135" ry="60" fill="none" stroke="rgba(255,53,79,0.35)" stroke-width="1.2" stroke-dasharray="5 7"/>
      <!-- Planet on Orbit 2: Python / Django -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="20s" repeatCount="indefinite"/>
        <g transform="translate(135, 0)">
          <circle cx="0" cy="0" r="13" fill="#0d1527" stroke="#ff354f" stroke-width="1.5"/>
          <text class="font-sans" x="0" y="4" fill="#ff758c" font-size="9" font-weight="800" text-anchor="middle">Py</text>
        </g>
      </g>
    </g>

    <!-- Orbit 3 (Outer, tilted -65deg) -->
    <g transform="rotate(-65)">
      <ellipse cx="0" cy="0" rx="170" ry="75" fill="none" stroke="rgba(0,210,255,0.3)" stroke-width="1.2" stroke-dasharray="6 8"/>
      <!-- Planet on Orbit 3: AWS / Docker -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="90" to="450" dur="26s" repeatCount="indefinite"/>
        <g transform="translate(170, 0)">
          <circle cx="0" cy="0" r="14" fill="#0d1527" stroke="#00d2ff" stroke-width="1.5"/>
          <text class="font-sans" x="0" y="4" fill="#ffffff" font-size="8" font-weight="800" text-anchor="middle">AWS</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Left Side: Grouped Stack Chips (4 Categories) -->
  <g transform="translate(48, 86)">
    <!-- Category 1: Frontend Architecture -->
    <g transform="translate(0, 0)">
      <text class="font-mono" x="0" y="16" fill="#00d2ff" font-size="12" font-weight="700">01 / FRONTEND &amp; UI</text>
      <!-- Chips -->
      <g transform="translate(0, 26)">
        <rect x="0" y="0" width="82" height="26" rx="6" fill="#0d1527" stroke="rgba(36,123,255,0.4)"/>
        <text class="font-sans" x="41" y="17" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">Next.js 15</text>

        <rect x="90" y="0" width="80" height="26" rx="6" fill="#0d1527" stroke="rgba(36,123,255,0.4)"/>
        <text class="font-sans" x="130" y="17" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">React.js</text>

        <rect x="178" y="0" width="94" height="26" rx="6" fill="#0d1527" stroke="rgba(36,123,255,0.4)"/>
        <text class="font-sans" x="225" y="17" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">TypeScript</text>

        <rect x="280" y="0" width="98" height="26" rx="6" fill="#0d1527" stroke="rgba(36,123,255,0.4)"/>
        <text class="font-sans" x="329" y="17" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">Tailwind CSS</text>

        <rect x="386" y="0" width="76" height="26" rx="6" fill="#0d1527" stroke="rgba(36,123,255,0.4)"/>
        <text class="font-sans" x="424" y="17" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">Redux</text>
      </g>
    </g>

    <!-- Category 2: Backend & APIs -->
    <g transform="translate(0, 64)">
      <text class="font-mono" x="0" y="16" fill="#ff758c" font-size="12" font-weight="700">02 / BACKEND &amp; INTEGRATIONS</text>
      <g transform="translate(0, 26)">
        <rect x="0" y="0" width="78" height="26" rx="6" fill="#0d1527" stroke="rgba(255,53,79,0.35)"/>
        <text class="font-sans" x="39" y="17" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">Node.js</text>

        <rect x="86" y="0" width="80" height="26" rx="6" fill="#0d1527" stroke="rgba(255,53,79,0.35)"/>
        <text class="font-sans" x="126" y="17" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">Express</text>

        <rect x="174" y="0" width="128" height="26" rx="6" fill="#0d1527" stroke="rgba(255,53,79,0.35)"/>
        <text class="font-sans" x="238" y="17" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">Python / Django</text>

        <rect x="310" y="0" width="102" height="26" rx="6" fill="#0d1527" stroke="rgba(255,53,79,0.35)"/>
        <text class="font-sans" x="361" y="17" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">PHP / Laravel</text>
      </g>
    </g>

    <!-- Category 3: Cloud & Databases -->
    <g transform="translate(0, 128)">
      <text class="font-mono" x="0" y="16" fill="#38bdf8" font-size="12" font-weight="700">03 / CLOUD &amp; DATABASES</text>
      <g transform="translate(0, 26)">
        <rect x="0" y="0" width="84" height="26" rx="6" fill="#0d1527" stroke="rgba(0,210,255,0.3)"/>
        <text class="font-sans" x="42" y="17" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">AWS Cloud</text>

        <rect x="92" y="0" width="74" height="26" rx="6" fill="#0d1527" stroke="rgba(0,210,255,0.3)"/>
        <text class="font-sans" x="129" y="17" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">Docker</text>

        <rect x="174" y="0" width="96" height="26" rx="6" fill="#0d1527" stroke="rgba(0,210,255,0.3)"/>
        <text class="font-sans" x="222" y="17" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">PostgreSQL</text>

        <rect x="278" y="0" width="76" height="26" rx="6" fill="#0d1527" stroke="rgba(0,210,255,0.3)"/>
        <text class="font-sans" x="316" y="17" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">MySQL</text>

        <rect x="362" y="0" width="102" height="26" rx="6" fill="#0d1527" stroke="rgba(0,210,255,0.3)"/>
        <text class="font-sans" x="413" y="17" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">Linux / Nginx</text>
      </g>
    </g>

    <!-- Category 4: African Fintech & CMS -->
    <g transform="translate(0, 192)">
      <text class="font-mono" x="0" y="16" fill="#00e676" font-size="12" font-weight="700">04 / FINTECH &amp; CMS SYSTEMS</text>
      <g transform="translate(0, 26)">
        <rect x="0" y="0" width="145" height="26" rx="6" fill="#0d1527" stroke="rgba(0,230,118,0.35)"/>
        <text class="font-sans" x="72" y="17" fill="#69f0ae" font-size="11.5" font-weight="700" text-anchor="middle">⚡ M-Pesa Daraja API</text>

        <rect x="153" y="0" width="94" height="26" rx="6" fill="#0d1527" stroke="rgba(0,230,118,0.35)"/>
        <text class="font-sans" x="200" y="17" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">WordPress</text>

        <rect x="255" y="0" width="115" height="26" rx="6" fill="#0d1527" stroke="rgba(0,230,118,0.35)"/>
        <text class="font-sans" x="312" y="17" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">WooCommerce</text>

        <rect x="378" y="0" width="112" height="26" rx="6" fill="#0d1527" stroke="rgba(0,230,118,0.35)"/>
        <text class="font-sans" x="434" y="17" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">Technical SEO</text>
      </g>
    </g>
  </g>
</svg>
